- name: Setup a basic developer environment
  hosts: localhost

  tasks:
    - name: Include tasks/install_packages.yml
      ansible.builtin.include_tasks: "tasks/{{ item }}.yml"
      loop:
        - packages
        - services
        - rclone
      tags:
        - packages
        - services
        - rclone
      when: ansible_facts['os_family'] == "Debian"

    - name: Set some environment variables
      become: false
      ansible.builtin.lineinfile:
        path: ~/.bashrc
        regexp: "^{{ item }}"
        line: "{{ item }}:$PATH"
      loop:
        - "export PATH=$HOME/bin" 
        - "export PATH=$HOME/.cargo/bin"
        - "export PATH=$HOME/.elan/bin"
        - "export PATH=$HOME/.local/bin"
      tags: env
      when: ansible_facts['os_family'] == "Debian"

  roles:
    - role: ajholanda.googlechrome
      tags: googlechrome
    - role: ajholanda.vscode
      tags: vscode
    - role: ajholanda.x2goclient
      tags: x2goclient

